name: Deploy PR Preview
author: Ross Williams
description: >
    Deploy a pull request preview to GitHub Pages, similar to Vercel and Netlify.


branding:
    icon: git-pull-request
    color: yellow

inputs:
    token:
        description: >
            The token to use for the deployment. Default is GITHUB_TOKEN in the current repository. If you need more permissions for things such as deploying to another repository, you can add a Personal Access Token (PAT).


        required: false
        default: ${{ github.token }}
    preview-branch:
        description: Branch on which the previews will be deployed.
        required: false
        default: gh-pages
    umbrella-dir:
        description: Path to the directory containing all previews.
        required: false
        default: pr-preview
    pages-base-url:
        description: URL of the repo's GitHub Pages site.
        required: false
        default: ""
    pages-base-path:
        description: Path that GitHub Pages is served from.
        required: false
        default: ""
    deployment-method:
        description: >
            Deployment backend. Use 'branch' for Deploy from branch, or 'pages-artifact' to publish a full GitHub Pages artifact with actions/deploy-pages.
        required: false
        default: branch
    pages-artifact-state-branch:
        description: >
            Branch used to persist the complete Pages site tree when deployment-method is 'pages-artifact'. This branch is not the Pages publishing source.
        required: false
        default: pr-preview-pages-artifact-state
    include-hidden-files:
        description: Include dotfiles in the GitHub Pages artifact. Enable only when your published site requires them.
        required: false
        default: "false"
    source-dir:
        description: >
            Directory containing files to deploy. In pages-artifact mode, provide the PR build on pull_request events and the full production site on default-branch pushes.
        required: false
        default: .
    pr-number:
        description: >
            The PR number to use for the preview path. Defaults to the PR number from the GitHub event context. Override this for testing or when not triggered by a pull_request event.


        required: false
        default: ""
    deploy-repository:
        description: >
            The GitHub repository to deploy the preview to. This should be formatted like `<org name>/<repo name>`, e.g. `rossjrw/pr-preview-action`. Defaults to the current repository.

            `pages-artifact` mode only supports the current repository because `actions/deploy-pages` publishes the repository running the workflow.
            
            You will need to add a Personal Access Token (PAT) in the `token` input in order to allow the action running in one repository to make changes to another repository.


        required: false
        default: ${{ github.repository }}
    wait-for-pages-deployment:
        description: >
            Whether to wait for GitHub Pages deployment before continuing, e.g. to ensure the preview URL is actually accessible when the sticky comment is posted.


        required: false
        default: "false"
    comment:
        description: Whether to leave a sticky comment on the calling PR at the end of the workflow.
        required: false
        default: "true"
    qr-code:
        description: URL to a QR code provider to generate a QR code for the preview URL in the comment. Preview URL will be appended to the string. Or, set to "false" to disable QR code generation.
        required: false
        default: "https://qr.rossjrw.com/?color.dark=0d1117&url="
    deploy-commit-message:
        description: The commit message to use when adding/updating a preview.
        required: false
        default: Deploy preview for PR ${{ github.event.number }} 🛫
    remove-commit-message:
        description: The commit message to use when removing a preview.
        required: false
        default: Remove preview for PR ${{ github.event.number }} 🛬
    git-config-name:
        description: The git user.name to use for the deployment commit.
        required: false
    git-config-email:
        description: The git user.email to use for the deployment commit.
        required: false

    custom-url:
        description: Deprecated, use `pages-base-url` instead.
        deprecationMessage: Use `pages-base-url` instead.
        required: false
        default: ""
    action:
        description: >
            Determines what this action will do when it is executed. Supported values: `deploy`, `remove`, `sync`, `auto` (default). `sync` is only available with deployment-method: pages-artifact.
            
            If set to `deploy`, will attempt to deploy the preview and overwrite any existing preview in that location.
            
            If set to `remove`, will attempt to remove the preview in that location.

            If set to `sync`, will update the production site in the Pages artifact state while preserving active previews.
            
            If set to `auto`, the action deploys on `pull_request.types.synchronize`, `.opened`, and `.reopened` events and removes on `.closed`. In pages-artifact mode, a push to the default branch also syncs the production site. Other events are ignored. `auto` is the default value.


        required: false
        default: auto

outputs:
    deployment-action:
        description: Resolved value of the 'action' input parameter (deploy, remove, sync, none).
        value: ${{ steps.setup.outputs.deployment_action }}
    pages-base-url:
        description: What this Action thinks the base URL of the GitHub Pages site is.
        value: ${{ steps.setup.outputs.pages_base_url }}
    preview-url-path:
        description: Path to the preview from the Pages base URL.
        value: ${{ steps.setup.outputs.preview_url_path }}
    preview-url:
        description: Full URL to the preview (https://[pages-base-url]/[preview-url-path]/).
        value: ${{ steps.setup.outputs.preview_url }}
    action-version:
        description: The version of this Action when it was run.
        value: ${{ steps.setup.outputs.action_version }}
    action-start-timestamp:
        description: The Unix timestamp that the action started.
        value: ${{ steps.setup.outputs.action_start_timestamp }}
    action-start-time:
        description: The time that the action started in a readable format (UTC, depending on runner).
        value: ${{ steps.setup.outputs.action_start_time }}
    deployed-commit-sha:
        description: The commit SHA persisted to the preview branch or Pages artifact state branch.
        value: ${{ steps.artifact-state.outputs.deployed_commit_sha || steps.deployed-commit.outputs.deployed_commit_sha || steps.removed-commit.outputs.deployed_commit_sha }}
    pages-deployment-url:
        description: URL returned by actions/deploy-pages in pages-artifact mode.
        value: ${{ steps.pages-deployment.outputs.page_url }}

    deployment-url:
        description: Deprecated, use `preview-url` instead.
        value: ${{ steps.setup.outputs.preview_url }}

runs:
    using: composite
    steps:
        - name: Setup preview environment
          id: setup
          env:
              deployment_action: ${{ inputs.action }}
              deployment_method: ${{ inputs.deployment-method }}
              umbrella_path: ${{ inputs.umbrella-dir }}
              pages_base_url: ${{ inputs.pages-base-url }}
              pages_base_path: ${{ inputs.pages-base-path }}
              pr_number: ${{ inputs.pr-number || github.event.number }}
              action_repository: ${{ github.action_repository || github.repository }}
              action_ref: ${{ github.action_ref || github.ref }}
              deployment_repository: ${{ inputs.deploy-repository }}
              pages_artifact_state_branch: ${{ inputs.pages-artifact-state-branch }}
              default_branch: ${{ github.event.repository.default_branch }}
              github_ref: ${{ github.ref }}
              token: ${{ inputs.token }}
              deprecated_custom_url: ${{ inputs.custom-url }}
          run: $GITHUB_ACTION_PATH/lib/main.sh
          shell: bash

        # DEPLOYMENT

        - name: Deploy preview directory
          if: env.deployment_method == 'branch' && env.deployment_action == 'deploy'
          uses: JamesIves/github-pages-deploy-action@4a3abc783e1a24aeb44c16e869ad83caf6b4cc23 # v4.7.4
          with:
              token: ${{ inputs.token }}
              repository-name: ${{ inputs.deploy-repository }}
              branch: ${{ inputs.preview-branch }}
              folder: ${{ inputs.source-dir }}
              target-folder: ${{ env.preview_file_path }}
              commit-message: ${{ inputs.deploy-commit-message }}
              force: false
              git-config-name: ${{ inputs.git-config-name }}
              git-config-email: ${{ inputs.git-config-email }}

        - name: Get commit SHA of preview deployment
          id: deployed-commit
          if: env.deployment_method == 'branch' && env.deployment_action == 'deploy'
          env:
              DEPLOY_REPO: ${{ inputs.deploy-repository }}
              DEPLOY_BRANCH: ${{ inputs.preview-branch }}
              DEPLOY_TOKEN: ${{ inputs.token }}
          run: $GITHUB_ACTION_PATH/lib/get-deployed-commit.sh
          shell: bash

        - name: Wait for preview deployment on GitHub Pages
          if: |
              env.deployment_action == 'deploy' &&
              env.deployment_method == 'branch' &&
              (inputs.wait-for-pages-deployment == 'true' || inputs.wait-for-pages-deployment == true) &&
              env.deployment_status == 'success'
          run: |
              source $GITHUB_ACTION_PATH/lib/wait-for-pages-deployment.sh
              wait_for_pages_deployment "${{ inputs.deploy-repository }}" "${{ steps.deployed-commit.outputs.deployed_commit_sha }}" "${{ inputs.preview-branch }}" "${{ inputs.token }}"
          shell: bash

        - name: Prepare GitHub Pages artifact state
          id: artifact-state
          if: |
              env.deployment_method == 'pages-artifact' &&
              (env.deployment_action == 'deploy' || env.deployment_action == 'remove' || env.deployment_action == 'sync')
          env:
              deployment_action: ${{ env.deployment_action }}
              source_dir: ${{ inputs.source-dir }}
              pages_artifact_state_branch: ${{ inputs.pages-artifact-state-branch }}
              deployment_repository: ${{ inputs.deploy-repository }}
              token: ${{ inputs.token }}
              umbrella_path: ${{ inputs.umbrella-dir }}
              preview_file_path: ${{ env.preview_file_path }}
              preview_number: ${{ env.preview_number }}
              default_branch: ${{ env.default_branch }}
              git_config_name: ${{ inputs.git-config-name }}
              git_config_email: ${{ inputs.git-config-email }}
              deploy_commit_message: ${{ inputs.deploy-commit-message }}
              remove_commit_message: ${{ inputs.remove-commit-message }}
          run: $GITHUB_ACTION_PATH/lib/deploy-pages-artifact.sh
          shell: bash

        - name: Upload GitHub Pages artifact
          if: |
              env.deployment_method == 'pages-artifact' &&
              (env.deployment_action == 'deploy' || env.deployment_action == 'remove' || env.deployment_action == 'sync')
          uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
          with:
              path: ${{ env.pages_artifact_path }}
              include-hidden-files: ${{ inputs.include-hidden-files }}

        - name: Deploy GitHub Pages artifact
          id: pages-deployment
          if: |
              env.deployment_method == 'pages-artifact' &&
              (env.deployment_action == 'deploy' || env.deployment_action == 'remove' || env.deployment_action == 'sync')
          uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
          with:
              token: ${{ inputs.token }}

        - name: Mark Pages artifact deployment successful
          if: steps.pages-deployment.outcome == 'success'
          run: echo "deployment_status=success" >> "$GITHUB_ENV"
          shell: bash

        - name: Generate comment content for deployment
          id: deploy-comment
          if: |
              env.deployment_action == 'deploy' &&
              (inputs.comment == 'true' || inputs.comment == true) &&
              (env.deployment_status == 'success' || env.deployment_status == 'skipped')
          run: |
              CONTENT=$($GITHUB_ACTION_PATH/lib/generate-comment.sh \
                "${{ env.action_repository }}" \
                "${{ env.action_version }}" \
                "${{ env.preview_url }}" \
                "${{ inputs.preview-branch }}" \
                "${{ github.server_url }}" \
                "${{ inputs.deploy-repository }}" \
                "${{ env.action_start_time }}" \
                "deploy" \
                "${{ inputs.qr-code }}" \
                "${{ env.deployment_method }}")
              {
                echo "content<<EOF"
                echo "$CONTENT"
                echo "EOF"
              } >> $GITHUB_OUTPUT
          shell: bash

        - name: Leave a comment after deployment
          if: |
              env.deployment_action == 'deploy' &&
              (inputs.comment == 'true' || inputs.comment == true) &&
              (env.deployment_status == 'success' || env.deployment_status == 'skipped') &&
              steps.deploy-comment.outcome == 'success'
          uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
          with:
              header: pr-preview
              message: ${{ steps.deploy-comment.outputs.content }}

        # REMOVAL

        - name: Remove preview directory
          if: env.deployment_method == 'branch' && env.deployment_action == 'remove'
          uses: JamesIves/github-pages-deploy-action@4a3abc783e1a24aeb44c16e869ad83caf6b4cc23 # v4.7.4
          with:
              token: ${{ inputs.token }}
              repository-name: ${{ inputs.deploy-repository }}
              branch: ${{ inputs.preview-branch }}
              folder: ${{ env.empty_dir_path }}
              target-folder: ${{ env.preview_file_path }}
              commit-message: ${{ inputs.remove-commit-message }}
              force: false
              git-config-name: ${{ inputs.git-config-name }}
              git-config-email: ${{ inputs.git-config-email }}

        - name: Get commit SHA of preview removal
          id: removed-commit
          if: env.deployment_method == 'branch' && env.deployment_action == 'remove'
          env:
              DEPLOY_REPO: ${{ inputs.deploy-repository }}
              DEPLOY_BRANCH: ${{ inputs.preview-branch }}
              DEPLOY_TOKEN: ${{ inputs.token }}
          run: $GITHUB_ACTION_PATH/lib/get-deployed-commit.sh
          shell: bash

        - name: Wait for preview removal on GitHub Pages
          if: |
              env.deployment_action == 'remove' &&
              env.deployment_method == 'branch' &&
              (inputs.wait-for-pages-deployment == 'true' || inputs.wait-for-pages-deployment == true) &&
              env.deployment_status == 'success'
          run: |
              source $GITHUB_ACTION_PATH/lib/wait-for-pages-deployment.sh
              wait_for_pages_deployment "${{ inputs.deploy-repository }}" "${{ steps.removed-commit.outputs.deployed_commit_sha }}" "${{ inputs.preview-branch }}" "${{ inputs.token }}"
          shell: bash

        - name: Generate comment content for removal
          id: remove-comment
          if: |
              env.deployment_action == 'remove' &&
              (inputs.comment == 'true' || inputs.comment == true) &&
              (env.deployment_status == 'success' || env.deployment_status == 'skipped')
          run: |
              CONTENT=$($GITHUB_ACTION_PATH/lib/generate-comment.sh \
                "${{ env.action_repository }}" \
                "${{ env.action_version }}" \
                "${{ env.preview_url }}" \
                "${{ inputs.preview-branch }}" \
                "${{ github.server_url }}" \
                "${{ inputs.deploy-repository }}" \
                "${{ env.action_start_time }}" \
                "remove" \
                "${{ env.qr_code_provider }}" \
                "${{ env.deployment_method }}")
              {
                echo "content<<EOF"
                echo "$CONTENT"
                echo "EOF"
              } >> $GITHUB_OUTPUT
          shell: bash

        - name: Leave a comment after removal
          if: |
              env.deployment_action == 'remove' &&
              (inputs.comment == 'true' || inputs.comment == true) &&
              (env.deployment_status == 'success' || env.deployment_status == 'skipped') &&
              steps.remove-comment.outcome == 'success'
          uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
          with:
              header: pr-preview
              message: ${{ steps.remove-comment.outputs.content }}
